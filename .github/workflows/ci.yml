name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ai-admin-control-center-backend

jobs:
  api-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api lint
      - run: pnpm exec vitest run apps/api/src/__tests__/ai-admin-foundation.test.ts
      - run: pnpm --filter api build
