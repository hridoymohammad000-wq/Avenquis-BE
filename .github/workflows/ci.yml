name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Environment Verification
        run: pnpm verify:env

      - name: Format Check
        run: pnpm format:check

      - name: Type Check
        run: pnpm typecheck

      - name: Lint Check
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build Projects
        run: pnpm build
